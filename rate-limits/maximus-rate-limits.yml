specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Maximus
providerId: maximus
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Government Services
  - Health
  - Technology
  - Rate Limiting
description: Maximus does not publish API rate limits because there is no public developer surface. Any
  integration limits are documented inside the relevant federal, state, or commercial contract / interface
  control document (ICD) and are not externally visible.
notes: |
  No public rate-limit documentation. Limits are governed by the contract / ICD / system security plan
  for each program. Set reconciled=true only if a public API surface emerges.
sources:
  - https://www.maximus.com/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Contract / ICD limit
    scope: contract
    metric: varies
    limit: 'per contract / interface control document'
    applies:
      - Maximus API
    notes: Throughput and concurrency obligations live in the contract or ICD; engineering teams should
      reference the system's authority-to-operate (ATO) artifacts.
policies:
  - name: Backoff Strategy
    description: Use exponential backoff with jitter on transient errors and honor Retry-After when
      present.
  - name: ICD-Driven Limits
    description: For government workloads, throughput, concurrency, and SLA targets are defined in the
      Interface Control Document and referenced contracts; integrations must respect those documented
      limits.
  - name: Idempotency
    description: Use unique transaction / case identifiers for state-changing requests so duplicate retries
      do not create duplicate records of record.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
