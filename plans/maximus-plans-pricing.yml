specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Maximus
providerId: maximus
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Government Services
  - Health
  - Technology
description: Maximus is a U.S. government services contractor (Medicaid / Medicare eligibility, child
  support enforcement, contact-center modernization, federal IT services). Maximus does not operate a
  public developer program; technical work is delivered under government and commercial contracts won
  through procurement (GSA schedules, RFP awards). There is no per-API-call price list — engagements are
  priced as time & materials, fixed-price, or transaction-per-case under each contract vehicle.
notes: |
  No public developer portal or pricing. Set reconciled=true only if a public API offering is launched.
  The api.maximus.com domain in the scaffold is illustrative; no public docs resolve there.
sources:
  - https://www.maximus.com/
  - https://www.maximus.com/federal
plans:
  - id: maximus-government-contract
    name: Government / Commercial Contract
    type: enterprise
    description: All Maximus engagements are delivered under contract — typically a federal, state, or
      commercial agreement priced as fixed-price, time-and-materials, or per-transaction (per case, per
      enrollment, per call handled).
    entries:
      - label: Contract Vehicle
        description: Pricing is set by the awarding contract (e.g. GSA schedule, BPA, IDIQ task order,
          state Medicaid contract). There is no per-API SKU.
        name: contract_vehicle
        type: tiered
        metric: varies
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: 'see contract / RFP award'
        userMultiplied: false
      - label: Per-Transaction Pricing
        description: Where applicable, services are priced per case / per enrollment / per call handled
          inside the contract.
        name: per_transaction
        type: metered
        metric: case
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: 'per contract'
        userMultiplied: false
    elements:
      - name: Eligibility & Enrollment Services
      - name: Customer Experience / Contact Center Services
      - name: Federal IT Modernization
      - name: Health Services Administration
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
