  - Health
  - Technology
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps shape for Maximus: government / commercial contractor priced via
  contract vehicles (fixed-price, time-and-materials, per-case). FinOps focus is on contract milestone
  tracking and per-transaction unit economics, not per-API-call billing.'
notes: |
  No public per-API pricing. Cost is allocated by program / contract / task order; meters represent
  contract-level economic units rather than API requests.
sources:
  - https://www.maximus.com/
  - https://www.maximus.com/federal
principles:
  - name: Visibility
    description: Track program spend at the task-order / contract-line-item-number (CLIN) level via
      government invoicing systems (e.g. WAWF / iRAPT for DoD, Treasury IPP for civilian) and integrate
      with internal ERP for project burn-down.
  - name: Allocation
    description: Allocate by contract / task order / CLIN. For state / health programs, allocate by
      state and program (Medicaid, CHIP, child support); for federal IT, allocate by agency, system,
      and ATO boundary.
  - name: Optimization
    description: Optimize contract structure (firm-fixed-price vs. T&M vs. per-case), automate eligibility
      and contact-center tasks where appropriate, and pursue option years / extensions where unit economics
      improve at scale.
  - name: Accountability
    description: Assign a contract / program manager per CLIN responsible for invoicing, milestone delivery,
      and government acceptance of deliverables.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Government Contract (FFP / T&M / Per-Transaction)
  billingFrequency: Monthly / Per-Milestone
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Maximus Services
  ServiceCategory: Government Services / IT Modernization
  ProviderName: Maximus
  PublisherName: Maximus, Inc.
  InvoiceIssuerName: Maximus, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: contract_value
    description: Total contract / task-order value, billed against milestones.
    unit: USD
    aggregation: max
    dimensions:
      - contract
      - clin
      - agency
  - name: cases_handled
    description: Eligibility cases or contact-center calls handled (per-transaction contract vehicles).
    unit: case
    aggregation: sum
    dimensions:
      - contract
      - state
      - program
  - name: labor_hours
    description: Billable labor hours under T&M contracts.
    unit: hour
    aggregation: sum
    dimensions:
      - contract
      - labor_category
apis:
  - name: Maximus API
    baseURL: https://api.maximus.com
    tags:
      - Government Services
      - Health
      - Technology
    serviceName: Maximus API
    serviceCategory: API
unitEconomics:
  - name: Cost per Case Handled
    metric: billed_cost / cases_handled
    target: TBD
  - name: Labor Recovery Rate
    metric: billable_hours / total_hours
    target: TBD
